<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ESP32 LED Control</title>
    <style>
      body { font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; margin: 2rem; }
      .row { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; }
      .pill { padding: .2rem .6rem; border-radius: 999px; display: inline-block; }
      .on { background: #d1fae5; color: #065f46; }
      .off { background: #fee2e2; color: #7f1d1d; }
      button { padding: .6rem 1rem; border: 1px solid #ddd; border-radius: .5rem; background: white; cursor: pointer; }
      button.primary { background: #111827; color: white; border-color: #111827; }
      code { background: #f3f4f6; padding: .15rem .35rem; border-radius: .25rem; }
      .small { color: #6b7280; }
    </style>
  </head>
  <body>
    <h1>ESP32 LED Control</h1>

    <div class="row">
      <div>Current state:</div>
      <div id="state" class="pill off">unknown</div>
    </div>

    <div class="row" style="margin-top: .75rem;">
      <div>Last count:</div>
      <div id="count" class="pill">-</div>
    </div>

    <div class="row" style="margin-top: 1rem;">
      <button class="primary" onclick="setLed('on')">Turn ON</button>
      <button onclick="setLed('off')">Turn OFF</button>
      <button onclick="refresh()">Refresh</button>
    </div>

    <p class="small" style="margin-top: 1.5rem;">
      ESP32 should poll: <code>GET /led</code> and expect plain text <code>on</code> / <code>off</code>.
    </p>

    <script>
      function renderLed(txt) {
        const el = document.getElementById('state');
        el.textContent = txt || 'empty';
        el.classList.toggle('on', txt === 'on');
        el.classList.toggle('off', txt !== 'on');
      }

      function renderCount(v) {
        const el = document.getElementById('count');
        el.textContent = (v === null || v === undefined) ? '-' : String(v);
      }

      async function refresh() {
        const r = await fetch('/led', { cache: 'no-store' });
        const txt = (await r.text()).trim().toLowerCase();
        renderLed(txt);

        // also fetch last count (optional)
        try {
          const rc = await fetch('/count', { cache: 'no-store' });
          const jc = await rc.json();
          renderCount(jc.last_count);
        } catch (e) {
          // ignore
        }
      }

      async function setLed(state) {
        await fetch('/led', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ state })
        });
        await refresh();
      }

      // SSE realtime updates
      const es = new EventSource('/events');
      es.addEventListener('snapshot', (ev) => {
        const data = JSON.parse(ev.data);
        renderLed(data.on ? 'on' : 'off');
        renderCount(data.last_count);
      });
      es.addEventListener('led', (ev) => {
        const data = JSON.parse(ev.data);
        renderLed(data.on ? 'on' : 'off');
      });
      es.addEventListener('count', (ev) => {
        const data = JSON.parse(ev.data);
        renderCount(data.count);
      });
      es.onerror = () => {
        // If SSE drops (sleep/wifi), fallback to periodic refresh.
      };

      refresh();
    </script>
  </body>
</html>
